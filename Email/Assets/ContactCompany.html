<!DOCTYPE html>
<html lang="es">
  <body style="margin:0;padding:0;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;">
    <div style="max-width:640px;margin:32px auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb;">
      <div style="background:#1f2937;padding:24px 32px;color:#ffffff;">
        <h2 style="margin:0;font-size:24px;">Nueva consulta {{reference}}</h2>
      </div>
      <div style="padding:32px; color:#1f2937;">
        <p style="margin:0 0 12px;">Has recibido una nueva consulta desde FuturCasa.</p>

        <p style="margin:0 0 8px;"><strong>Tipo:</strong> {{category}}</p>
        <p style="margin:0 0 8px;"><strong>Asunto:</strong> {{subject}}</p>
        <p style="margin:0 0 8px;"><strong>Usuario:</strong> {{fromName}}</p>
        <p style="margin:0 0 8px;"><strong>Email:</strong> {{fromAddress}}</p>
        <p style="margin:0 0 8px;"><strong>ID de usuario:</strong> {{userId}}</p>
        <p style="margin:0 0 8px;"><strong>Teléfono:</strong> {{phone}}</p>

        <div style="margin-top:24px;padding:20px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;">
          <h3 style="margin:0 0 12px;font-size:18px;">Mensaje</h3>
          <p style="margin:0;line-height:1.6;white-space:pre-wrap;">{{message}}</p>
        </div>
      </div>
    </div>
  </body>
</html>
