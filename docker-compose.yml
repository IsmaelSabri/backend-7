services:

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMQ__Username:?Set RabbitMQ__Username in .env}
      RABBITMQ_DEFAULT_PASS: ${RabbitMQ__Password:?Set RabbitMQ__Password in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  images-worker:
    build:
      context: .
      dockerfile: ImageWorker/Dockerfile
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RabbitMQ__Username:?Set RabbitMQ__Username in .env}
      RabbitMQ__Password: ${RabbitMQ__Password:?Set RabbitMQ__Password in .env}
      ConnectionStrings__PostgreSQLConnection: ${IMAGE_WORKER_DB_CONNECTION:?Set IMAGE_WORKER_DB_CONNECTION in .env}
    volumes:
      - type: bind
        source: ./Images/appsettings.json
        target: /app/appsettings.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - default
      - postgres
    depends_on:
      rabbitmq:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped
    

  postgres:
    container_name: postgres-sql
    image: postgres:18  # 1. Congelamos explícitamente la versión estable actual
    hostname: host
    environment:
      POSTGRES_USER: yo
      POSTGRES_PASSWORD: admin
      PGDATA: /var/lib/postgresql/data/houses_cluster # 2. Ruta de datos interna recomendada
      POSTGRES_DB: housesdb
    volumes:
      # 3. Apuntamos a la carpeta padre del contenedor (/var/lib/postgresql) 
      - ~/Documentos/docker-vol/postgres-volume/data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - postgres
    restart: unless-stopped


  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.19
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - ~/Documentos/docker-vol/pgadmin-volume/data:/var/lib/pgadmin
    ports:
      - "5050:80"
    user: root
    networks:
      - postgres
    restart: unless-stopped
    depends_on:
      - postgres

networks:
  postgres:
    driver: bridge

volumes:
  rabbitmq-data: